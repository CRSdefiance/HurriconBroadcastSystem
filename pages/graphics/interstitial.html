<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><script type="module" src="/src/graphic.ts"></script></head>
<body class="graphic" data-layout="interstitial"><main class="stage interstitial">
  <div class="background" data-scene-background></div>
  <header class="interstitial-header panel"><img data-logo class="brand-logo"><div><div class="eyebrow">Hurricon Broadcast</div><h1>Between events</h1></div><div class="interstitial-live"><i></i>Programming continues shortly</div></header>
  <section class="interstitial-feature panel" data-interstitial-feature><div class="interstitial-image" data-slide-image><span>EVENT INFORMATION</span></div><div class="interstitial-copy"><div class="eyebrow" data-slide-kicker></div><h2 data-slide-title></h2><p data-slide-body></p></div></section>
  <aside class="interstitial-side">
    <section class="panel next-card"><div class="eyebrow">Up next</div><h2 data-next></h2><p data-next-time></p></section>
    <section class="panel donation-card"><div class="eyebrow">Community support</div><strong data-interstitial-donation></strong><span data-interstitial-goal></span><div class="donation-progress"><i data-interstitial-progress></i></div></section>
    <section class="panel partner-card"><div class="eyebrow">Presented with support from</div><img data-interstitial-sponsor-logo><strong data-interstitial-sponsor></strong></section>
  </aside>
  <footer class="music-now-playing panel"><div class="music-art"><img data-music-artwork><span>♫</span></div><div class="music-source"><div class="eyebrow" data-music-source>Music</div><strong data-music-title>Music paused</strong><span data-music-detail></span></div><div class="music-state" data-music-state>Paused</div></footer>
</main></body></html>
